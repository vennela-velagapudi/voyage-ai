<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>Voyage AI - Plan Your Perfect Trip with AI</title>
    <meta
      name="description"
      content="Embark on seamless travel planning with Voyage AI. Generate custom, optimized, and personalized travel itineraries instantly using advanced artificial intelligence."
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('voyage_theme');
          var theme =
            savedTheme ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
          if (!savedTheme) {
            localStorage.setItem('voyage_theme', theme);
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-surface-base text-text-main font-sans antialiased selection:bg-indigo-500 selection:text-white transition-all-custom">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
